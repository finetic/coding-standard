name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --prefer-stable

      - name: Run tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist

      - name: Check coding standard
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  pr-ready:
    name: PR Ready Notification
    runs-on: ubuntu-latest
    if: >
      success() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'synchronize' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'release')
    needs: [test]

    steps:
      - name: Notify PR ready
        uses: finetic/deployers/slack-notify@main
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_PULL_REQUESTS }}
          message: |
            👀 PR klaar voor review
            Project: ${{ github.event.repository.name }}
            PR: ${{ github.event.pull_request.title }}
            Auteur: ${{ github.actor }}
            Link: ${{ github.event.pull_request.html_url }}
